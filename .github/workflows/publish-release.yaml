name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'URL of a .vsix to download.'
        required: true
        type: string
      dry_run:
        description: 'Validate everything and stop before publishing.'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-release:
    name: Publish Release ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '(dry run)' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js Environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1

      - name: Run node-gyp bug workaround script
        run: |
          curl -sSfLO https://raw.githubusercontent.com/mongodb-js/compass/42e6142ae08be6fec944b80ff6289e6bcd11badf/.evergreen/node-gyp-bug-workaround.sh && bash node-gyp-bug-workaround.sh

      - name: Install VSCode publishing dependencies
        run: npm install -g @vscode/vsce@4.1.0

      - name: Download release assets
        run: |
          if [[ -z "${ASSET_URL}" ]]; then
            echo "No VSIX URL provided"
            exit 1
          fi

          filename=$(basename -- "$ASSET_URL")
          extension="${filename##*.}"

          if [[ $extension != "vsix" ]]; then
            echo "Wrong asset extension ${extension} in ${ASSET_URL}"
            exit 1
          else
            wget -O ${filename} "${ASSET_URL}"
            ls -al ${filename}
            echo "VSIX_PATH=${filename}" >> $GITHUB_ENV
          fi
        env:
          ASSET_URL: ${{ github.event_name == 'release' && github.event.release.assets[0].browser_download_url || inputs.asset_url }}

      # Exchanges a GitHub OIDC token for a Marketplace credential exactly the way
      # `vsce publish --oidc` does, without publishing anything.
      - name: Validate OIDC trusted publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          VSCE_PUBLISHER: mongodb
        run: |
          set -euo pipefail

          token=$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=marketplace.visualstudio.com" | jq -r .value)
          echo "Obtained GitHub OIDC token (${#token} chars)"

          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          keys = ('iss', 'aud', 'sub', 'event_name', 'repository', 'workflow_ref', 'ref', 'environment')
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          PY

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" \
            -H "Authorization: FederatedToken ${token}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"publisherName\":\"${VSCE_PUBLISHER}\"}")

          status=$(tail -n1 <<<"${response}")
          body=$(sed '$d' <<<"${response}")

          # The credential grants publish rights for 15 minutes, so it must never
          # reach the (public) workflow log: only print the body when the request
          # failed, and mask the credential in case it is ever echoed.
          if [[ "${status}" != "200" ]]; then
            echo "Marketplace response: HTTP ${status}"
            echo "${body}"
            exit 1
          fi

          credential=$(jq -r '.credential // empty' <<<"${body}")
          if [[ -z "${credential}" ]]; then
            echo "No credential in response: ${body}"
            exit 1
          fi
          echo "::add-mask::${credential}"

          echo "HTTP ${status}: received a Marketplace credential (${#credential} chars)"
          echo "OK: OIDC trusted publishing is configured for ${VSCE_PUBLISHER}"

      - name: Publish to marketplace
        if: github.event_name == 'release' || inputs.dry_run != true
        run: |
          echo "Publishing ${VSIX_PATH} to marketplace"
          vsce publish --packagePath "${VSIX_PATH}" --githubBranch main --oidc

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run complete for ${VSIX_PATH}."
          echo "OIDC credential obtained for publisher 'mongodb'; nothing was published."
          echo "A real run would have executed: vsce publish --packagePath '${VSIX_PATH}' --githubBranch main --oidc"
